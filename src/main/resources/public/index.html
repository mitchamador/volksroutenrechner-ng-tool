<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Журнал маршрутного компьютера</title>
    <link href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="/webjars/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h1 class="h3 mb-4">Журнал маршрутного компьютера</h1>

    <div class="card mb-4">
        <div class="card-body d-flex flex-wrap gap-4 align-items-end">
            <div>
                <label class="form-label mb-1">Период с</label>
                <input type="date" id="filterFrom" class="form-control form-control-sm">
            </div>
            <div>
                <label class="form-label mb-1">по</label>
                <input type="date" id="filterTo" class="form-control form-control-sm">
            </div>
            <div>
                <button id="applyFilter" class="btn btn-sm btn-primary">Применить</button>
                <button id="resetFilter" class="btn btn-sm btn-outline-secondary">Сбросить</button>
            </div>
            <div>
                <label class="form-label mb-1">Записей на странице</label>
                <select id="pageSize" class="form-select form-select-sm">
                    <option value="10">10</option>
                    <option value="25" selected>25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </div>

            <div class="ms-md-auto d-flex flex-wrap gap-2 align-items-end">
                <div>
                    <label class="form-label mb-1">Импорт файла EEPROM</label>
                    <input type="file" id="importFile" class="form-control form-control-sm">
                </div>
                <button id="importBtn" class="btn btn-sm btn-success">Импортировать</button>
            </div>
        </div>
        <div class="card-body pt-0 small text-muted" id="importStatus"></div>
    </div>

    <ul class="nav nav-tabs" id="mainTabs">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-C" type="button">Trip C</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-A" type="button">Trip A</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-B" type="button">Trip B</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-accel" type="button">Accel</button></li>
    </ul>

    <div class="tab-content border border-top-0 p-3 bg-white">
        <div class="tab-pane fade show active" id="tab-C">
            <div class="table-responsive"><table class="table table-striped table-sm align-middle" id="table-C"></table></div>
            <div class="d-flex justify-content-between align-items-center mt-2">
                <div class="small text-muted" id="pageInfo-C"></div>
                <div>
                    <button class="btn btn-sm btn-outline-secondary" id="prevPage-C">&laquo; Назад</button>
                    <button class="btn btn-sm btn-outline-secondary" id="nextPage-C">Вперёд &raquo;</button>
                </div>
            </div>
        </div>
        <div class="tab-pane fade" id="tab-A">
            <div class="table-responsive"><table class="table table-striped table-sm align-middle" id="table-A"></table></div>
            <div class="d-flex justify-content-between align-items-center mt-2">
                <div class="small text-muted" id="pageInfo-A"></div>
                <div>
                    <button class="btn btn-sm btn-outline-secondary" id="prevPage-A">&laquo; Назад</button>
                    <button class="btn btn-sm btn-outline-secondary" id="nextPage-A">Вперёд &raquo;</button>
                </div>
            </div>
        </div>
        <div class="tab-pane fade" id="tab-B">
            <div class="table-responsive"><table class="table table-striped table-sm align-middle" id="table-B"></table></div>
            <div class="d-flex justify-content-between align-items-center mt-2">
                <div class="small text-muted" id="pageInfo-B"></div>
                <div>
                    <button class="btn btn-sm btn-outline-secondary" id="prevPage-B">&laquo; Назад</button>
                    <button class="btn btn-sm btn-outline-secondary" id="nextPage-B">Вперёд &raquo;</button>
                </div>
            </div>
        </div>
        <div class="tab-pane fade" id="tab-accel">
            <div class="table-responsive"><table class="table table-striped table-sm align-middle" id="table-accel"></table></div>
            <div class="d-flex justify-content-between align-items-center mt-2">
                <div class="small text-muted" id="pageInfo-accel"></div>
                <div>
                    <button class="btn btn-sm btn-outline-secondary" id="prevPage-accel">&laquo; Назад</button>
                    <button class="btn btn-sm btn-outline-secondary" id="nextPage-accel">Вперёд &raquo;</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-body d-flex flex-wrap gap-3 align-items-end">
            <div>
                <label class="form-label mb-1">Экспорт: формат</label>
                <select id="exportFormat" class="form-select form-select-sm">
                    <option value="bin">Binary (.bin)</option>
                    <option value="c">C source (.c)</option>
                </select>
            </div>
            <div>
                <label class="form-label mb-1">Размер (JournalSize)</label>
                <select id="exportSize" class="form-select form-select-sm">
                    <option value="2048">2048</option>
                    <option value="768">768</option>
                </select>
            </div>
            <button id="exportBtn" class="btn btn-sm btn-primary">Скачать</button>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Подтверждение</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                Удалить запись?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Удалить</button>
            </div>
        </div>
    </div>
</div>

<script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
